
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Previsão de Preços Imobiliários</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f3f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 550px;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        h1 {
            color: #1e293b;
            font-size: 27px;
            margin-bottom: 12px;
        }

        .descricao {
            color: #64748b;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        h2 {
            color: #334155;
            font-size: 19px;
            margin-bottom: 22px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 18px;
        }

        label {
            display: block;
            color: #475569;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .resultado {
            margin-top: 30px;
            padding: 22px;
            background: #eff6ff;
            border-radius: 10px;
        }

        .resultado p {
            color: #475569;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .preco {
            color: #1d4ed8;
            font-size: 28px;
            font-weight: bold;
        }

        .erro {
            color: #dc2626;
            margin-top: 15px;
            font-size: 14px;
        }

    </style>
</head>

<body>

    <div class="container">

        <h1>Previsão de Preços Imobiliários</h1>

        <p class="descricao">
            Utilize o meu modelo de Machine Learning para prever o preço de venda
            um imóvel situado na cidade de São Paulo.
        </p>

        <h2>Dados do Imóvel</h2>

        <form action="{{ url_for('main') }}" method="POST" id="formulario">

            <div class="form-group">
                <label for="area">Área do Imóvel (m²)</label>
                <input type="number" id="area" name="area" step="any"
                    min="0" placeholder="Ex: 85" required>
            </div>

            <div class="form-group">
                <label for="condominio">Valor do Condomínio (R$)</label>
                <input type="number" id="condominio" name="condominio" step="any"
                    min="0" placeholder="Ex: 650" required>
            </div>

            <div class="form-group">
                <label for="quartos">Número de Quartos</label>
                <input type="number" id="quartos" name="quartos"
                    min="0" step="1" placeholder="Ex: 3" required>
            </div>

            <div class="form-group">
                <label for="suites">Número de Suítes</label>
                <input type="number" id="suites" name="suites"
                    min="0" step="1" placeholder="Ex: 1" required>
            </div>

            <button type="submit" id="botao">
                Calcular Preço
            </button>

        </form>

        {% if valor_venda %}
            <div class="resultado">
                <p>Preço estimado do imóvel</p>
                <div class="preco" id="preco">
                R$ {{ valor_venda }}
                </div>
            </div>
        {% endif %}

        <p class="erro" id="erro"></p>

    </div>

</body>
</html>
